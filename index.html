<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pas de `user-scalable=0` : l'ancien site bloquait le zoom, ce qui
      est un échec au critère WCAG 1.4.4 et un signal négatif dans le
      rapport d'ergonomie mobile de Google.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0A" />

    <!--
      Aucun <title>, <meta description>, canonical ni Open Graph ici.
      C'est délibéré : <Seo> les rend dans l'arbre React et le prérendu
      les écrit en tête du <head> de chaque page. Les laisser aussi
      dans ce gabarit produirait DEUX <title> par document — celui de
      la page puis celui, générique, du gabarit.
    -->
    <!-- Polices : preconnect + swap, pour ne jamais bloquer le rendu -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
